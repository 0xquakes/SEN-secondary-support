  <!-- Student 3 (center-right) -->
  <circle cx="480" cy="330" r="32" fill="#FB923C"/>
  <rect x="458" y="362" width="44" height="65" rx="7" fill="#8B5CF6"/>
  <circle cx="470" cy="323" r="4" fill="#1E293B"/>
  <circle cx="488" cy="323" r="4" fill="#1E293B"/>
