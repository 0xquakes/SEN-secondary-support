<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" fill="none">
  <!-- Background -->
  <circle cx="150" cy="100" r="85" fill="#FEF3C7" opacity="0.3"/>

  <!-- Two people talking -->
  <!-- Person 1 (left) -->
  <circle cx="80" cy="90" r="28" fill="#FCD34D"/>
  <rect x="58" y="120" width="44" height="60" rx="8" fill="#8B5CF6"/>
  <circle cx="70" cy="84" r="4" fill="#1E293B"/>
  <circle cx="90" cy="84" r="4" fill="#1E293B"/>
  <path d="M74 98 Q80 104 86 98" stroke="#1E293B" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- Person 2 (right) -->
  <circle cx="220" cy="90" r="28" fill="#A78BFA"/>
  <rect x="198" y="120" width="44" height="60" rx="8" fill="#10B981"/>
  <circle cx="210" cy="84" r="4" fill="#1E293B"/>
  <circle cx="230" cy="84" r="4" fill="#1E293B"/>
  <path d="M214 98 Q220 104 226 98" stroke="#1E293B" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- Speech bubbles -->
  <!-- Left bubble -->
  <path d="M115 50 Q115 30 140 30 L175 30 Q195 30 195 50 L195 70 Q195 85 175 85 L130 85 L120 100 L125 85 Q115 85 115 70 Z" fill="white" stroke="#8B5CF6" stroke-width="2"/>
  <rect x="130" y="45" width="50" height="5" rx="1" fill="#8B5CF6"/>
  <rect x="130" y="55" width="40" height="5" rx="1" fill="#DDD6FE"/>
  <rect x="130" y="65" width="45" height="5" rx="1" fill="#DDD6FE"/>

  <!-- Right bubble (response) -->
  <path d="M140 110 Q140 95 160 95 L195 95 Q210 95 210 110 L210 125 Q210 138 195 138 L175 138 L185 150 L177 138 Q140 138 140 125 Z" fill="white" stroke="#10B981" stroke-width="2"/>
  <circle cx="160" cy="117" r="5" fill="#10B981"/>
  <path d="M157 117 L159 119 L163 115" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="170" y="114" width="30" height="5" rx="1" fill="#D1FAE5"/>
  <rect x="155" y="125" width="45" height="4" rx="1" fill="#D1FAE5"/>

  <!-- Hearts/positive indicators -->
  <path d="M260 50 C260 45 265 40 270 45 C275 40 280 45 280 50 C280 58 270 65 270 65 C270 65 260 58 260 50" fill="#F87171"/>
  <path d="M40 130 C40 126 44 123 48 126 C52 123 56 126 56 130 C56 136 48 141 48 141 C48 141 40 136 40 130" fill="#F87171"/>

  <!-- Stars -->
  <path d="M50 60 L52 66 L58 66 L53 70 L55 76 L50 72 L45 76 L47 70 L42 66 L48 66 Z" fill="#FCD34D"/>
  <path d="M260 140 L261 144 L265 144 L262 147 L263 151 L260 148 L257 151 L258 147 L255 144 L259 144 Z" fill="#FCD34D"/>

  <!-- Decorative dots -->
  <circle cx="150" cy="30" r="5" fill="#A5F3FC" opacity="0.6"/>
  <circle cx="30" cy="100" r="6" fill="#C4B5FD" opacity="0.5"/>
  <circle cx="270" cy="100" r="7" fill="#FED7AA" opacity="0.5"/>
</svg>
