  <rect x="100" y="250" width="25" height="25" rx="5" fill="#C4B5FD" opacity="0.5" transform="rotate(15 112 262)"/>
  <rect x="670" cy="280" width="30" height="30" rx="5" fill="#FECACA" opacity="0.5" transform="rotate(-10 685 295)"/>

