<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <!-- Background -->
  <circle cx="200" cy="150" r="115" fill="#EDE9FE" opacity="0.4"/>

  <!-- Magic wand with sparkles -->
  <rect x="80" y="100" width="120" height="14" rx="3" fill="#8B5CF6" transform="rotate(-35 140 107)"/>
  <rect x="65" y="85" width="25" height="25" rx="4" fill="#FCD34D" transform="rotate(-35 77 97)"/>
  <rect x="68" y="88" width="8" height="8" fill="#F59E0B" transform="rotate(-35 72 92)"/>

  <!-- Sparkles around wand -->
  <path d="M120 60 L123 68 L131 68 L125 73 L127 81 L120 76 L113 81 L115 73 L109 68 L117 68 Z" fill="#FCD34D"/>
  <path d="M85 120 L87 125 L92 125 L88 128 L89 133 L85 130 L81 133 L82 128 L78 125 L83 125 Z" fill="#FCD34D"/>
  <path d="M150 90 L151 94 L155 94 L152 96 L153 100 L150 98 L147 100 L148 96 L145 94 L149 94 Z" fill="#FCD34D"/>

  <!-- Document/EHCP being generated -->
  <rect x="200" y="60" width="140" height="180" rx="6" fill="white" stroke="#CBD5E1" stroke-width="2"/>

  <!-- Document header -->
  <rect x="215" y="75" width="80" height="12" rx="2" fill="#8B5CF6"/>
  <rect x="215" y="95" width="110" height="6" rx="1" fill="#E2E8F0"/>
  <rect x="215" y="107" width="95" height="6" rx="1" fill="#E2E8F0"/>

  <!-- Strategy blocks appearing -->
  <rect x="215" y="125" width="110" height="35" rx="4" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5"/>
  <rect x="225" y="135" width="60" height="6" rx="1" fill="#10B981"/>
  <rect x="225" y="147" width="85" height="4" rx="1" fill="#A7F3D0"/>

  <rect x="215" y="168" width="110" height="35" rx="4" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.5"/>
  <rect x="225" y="178" width="55" height="6" rx="1" fill="#F59E0B"/>
  <rect x="225" y="190" width="80" height="4" rx="1" fill="#FDE68A"/>

  <rect x="215" y="211" width="110" height="20" rx="4" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="4 2"/>
  <rect x="260" y="218" width="20" height="6" rx="1" fill="#CBD5E1"/>

  <!-- Floating elements -->
  <circle cx="180" cy="180" r="15" fill="#A5F3FC" opacity="0.6"/>
  <circle cx="360" cy="100" r="12" fill="#FECACA" opacity="0.6"/>

  <!-- Small icons floating -->
  <rect x="165" y="100" width="20" height="20" rx="4" fill="#FCD34D" opacity="0.8"/>
  <rect x="360" y="200" width="18" height="18" rx="4" fill="#C4B5FD" opacity="0.8"/>

  <!-- Arrow showing generation -->
  <path d="M170 150 L195 150" stroke="#8B5CF6" stroke-width="3" stroke-linecap="round" marker-end="url(#arrowhead)"/>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#8B5CF6"/>
    </marker>
  </defs>
</svg>
