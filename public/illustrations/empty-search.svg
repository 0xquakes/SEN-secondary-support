  <circle cx="180" cy="130" r="50" stroke="#94A3B8" stroke-width="8" fill="white"/>
  <line x1="215" y1="165" x2="260" y2="210" stroke="#94A3B8" stroke-width="10" stroke-linecap="round"/>

  <!-- Question mark inside -->
  <path d="M165 115 Q165 100 180 100 Q195 100 195 115 Q195 125 180 130 L180 140" stroke="#CBD5E1" stroke-width="6" fill="none" stroke-linecap="round"/>
  <circle cx="180" cy="152" r="4" fill="#CBD5E1"/>

  <!-- Floating documents -->
  <rect x="70" y="80" width="35" height="45" rx="3" fill="white" stroke="#E2E8F0" stroke-width="2"/>
  <line x1="78" y1="92" x2="97" y2="92" stroke="#E2E8F0" stroke-width="2"/>
  <line x1="78" y1="100" x2="93" y2="100" stroke="#E2E8F0" stroke-width="2"/>
  <line x1="78" y1="108" x2="95" y2="108" stroke="#E2E8F0" stroke-width="2"/>

  <rect x="295" y="70" width="35" height="45" rx="3" fill="white" stroke="#E2E8F0" stroke-width="2"/>
  <line x1="303" y1="82" x2="322" y2="82" stroke="#E2E8F0" stroke-width="2"/>
  <line x1="303" y1="90" x2="318" y2="90" stroke="#E2E8F0" stroke-width="2"/>
  <line x1="303" y1="98" x2="320" y2="98" stroke="#E2E8F0" stroke-width="2"/>

  <!-- Decorative dots -->
  <circle cx="60" cy="160" r="6" fill="#10B981" opacity="0.3"/>
  <circle cx="340" cy="150" r="8" fill="#10B981" opacity="0.3"/>
  <circle cx="120" cy="200" r="5" fill="#FCD34D" opacity="0.4"/>
  <circle cx="280" cy="190" r="7" fill="#FCD34D" opacity="0.4"/>

  <!-- Text area placeholder -->
  <text x="200" y="260" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#64748B">No results found</text>
  <text x="200" y="280" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#94A3B8">Try adjusting your search</text>
</svg>
