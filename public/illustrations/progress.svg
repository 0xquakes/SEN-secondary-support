<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" fill="none">
  <!-- Background -->
  <circle cx="150" cy="100" r="90" fill="#ECFDF5" opacity="0.3"/>

  <!-- Progress chart/graph -->
  <rect x="50" y="40" width="200" height="130" rx="8" fill="white" stroke="#E2E8F0" stroke-width="2"/>

  <!-- Grid lines -->
  <line x1="80" y1="60" x2="80" y2="150" stroke="#F1F5F9" stroke-width="1"/>
  <line x1="120" y1="60" x2="120" y2="150" stroke="#F1F5F9" stroke-width="1"/>
  <line x1="160" y1="60" x2="160" y2="150" stroke="#F1F5F9" stroke-width="1"/>
  <line x1="200" y1="60" x2="200" y2="150" stroke="#F1F5F9" stroke-width="1"/>

  <line x1="70" y1="80" x2="230" y2="80" stroke="#F1F5F9" stroke-width="1"/>
  <line x1="70" y1="105" x2="230" y2="105" stroke="#F1F5F9" stroke-width="1"/>
  <line x1="70" y1="130" x2="230" y2="130" stroke="#F1F5F9" stroke-width="1"/>

  <!-- Progress line going up -->
  <path d="M70 140 L100 130 L130 115 L160 95 L190 80 L220 65" stroke="#10B981" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Data points -->
  <circle cx="70" cy="140" r="5" fill="#10B981"/>
  <circle cx="100" cy="130" r="5" fill="#10B981"/>
  <circle cx="130" cy="115" r="5" fill="#10B981"/>
  <circle cx="160" cy="95" r="5" fill="#10B981"/>
  <circle cx="190" cy="80" r="5" fill="#10B981"/>
  <circle cx="220" cy="65" r="6" fill="#10B981" stroke="white" stroke-width="2"/>

  <!-- Upward arrow at end -->
  <path d="M230 60 L240 50 L250 60" stroke="#10B981" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="240" y1="50" x2="240" y2="75" stroke="#10B981" stroke-width="3" stroke-linecap="round"/>

  <!-- Trophy/achievement -->
  <path d="M255 120 L265 120 L265 130 Q260 140 255 130 Z" fill="#FCD34D"/>
  <rect x="257" y="140" width="6" height="8" fill="#FCD34D"/>
  <rect x="254" y="148" width="12" height="4" rx="1" fill="#FCD34D"/>
  <path d="M250 120 Q245 125 250 130" stroke="#FCD34D" stroke-width="3" fill="none"/>
  <path d="M270 120 Q275 125 270 130" stroke="#FCD34D" stroke-width="3" fill="none"/>

  <!-- Star burst -->
  <path d="M260 100 L262 108 L270 108 L264 113 L266 121 L260 116 L254 121 L256 113 L250 108 L258 108 Z" fill="#FCD34D"/>

  <!-- Small celebratory elements -->
  <circle cx="40" cy="60" r="6" fill="#A5F3FC"/>
  <circle cx="280" cy="170" r="5" fill="#C4B5FD"/>
  <rect x="30" y="140" width="10" height="10" rx="2" fill="#FED7AA" transform="rotate(15 35 145)"/>

  <!-- Confetti dots -->
  <circle cx="55" cy="30" r="3" fill="#F87171"/>
  <circle cx="245" cy="35" r="3" fill="#34D399"/>
  <circle cx="275" cy="80" r="3" fill="#60A5FA"/>
  <circle cx="30" cy="100" r="3" fill="#FCD34D"/>
</svg>
