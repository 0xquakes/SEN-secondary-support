  <line x1="300" y1="130" x2="450" y2="130" stroke="#10B981" stroke-width="3" stroke-linecap="round"/>
  <line x1="300" y1="150" x2="480" y2="150" stroke="#10B981" stroke-width="3" stroke-linecap="round"/>

