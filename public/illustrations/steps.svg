<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" fill="none">
  <!-- Background -->
  <rect x="0" y="0" width="400" height="200" fill="white"/>

  <!-- Step 1 -->
  <circle cx="70" cy="100" r="35" fill="#ECFDF5" stroke="#10B981" stroke-width="3"/>
  <text x="70" y="108" text-anchor="middle" font-family="system-ui" font-size="24" font-weight="bold" fill="#10B981">1</text>
  <rect x="40" y="145" width="60" height="8" rx="2" fill="#E2E8F0"/>
  <rect x="50" y="158" width="40" height="6" rx="2" fill="#E2E8F0"/>

  <!-- Arrow 1 -->
  <path d="M115 100 L145 100" stroke="#CBD5E1" stroke-width="3" stroke-linecap="round"/>
  <path d="M140 95 L150 100 L140 105" fill="#CBD5E1"/>

  <!-- Step 2 -->
  <circle cx="200" cy="100" r="35" fill="#ECFDF5" stroke="#10B981" stroke-width="3"/>
  <text x="200" y="108" text-anchor="middle" font-family="system-ui" font-size="24" font-weight="bold" fill="#10B981">2</text>
  <rect x="170" y="145" width="60" height="8" rx="2" fill="#E2E8F0"/>
  <rect x="180" y="158" width="40" height="6" rx="2" fill="#E2E8F0"/>

  <!-- Arrow 2 -->
  <path d="M245 100 L275 100" stroke="#CBD5E1" stroke-width="3" stroke-linecap="round"/>
  <path d="M270 95 L280 100 L270 105" fill="#CBD5E1"/>

  <!-- Step 3 -->
  <circle cx="330" cy="100" r="35" fill="#10B981"/>
  <text x="330" y="108" text-anchor="middle" font-family="system-ui" font-size="24" font-weight="bold" fill="white">3</text>
  <rect x="300" y="145" width="60" height="8" rx="2" fill="#E2E8F0"/>
  <rect x="310" y="158" width="40" height="6" rx="2" fill="#E2E8F0"/>

  <!-- Sparkle on step 3 -->
  <path d="M365 70 L367 76 L373 76 L368 80 L370 86 L365 82 L360 86 L362 80 L357 76 L363 76 Z" fill="#FCD34D"/>

  <!-- Decorative dots -->
  <circle cx="30" cy="50" r="5" fill="#A5F3FC" opacity="0.6"/>
  <circle cx="370" cy="170" r="6" fill="#C4B5FD" opacity="0.6"/>
  <circle cx="200" cy="40" r="4" fill="#FCD34D" opacity="0.6"/>
