  <rect x="212" y="58" width="45" height="5" rx="2" fill="#E2E8F0"/>
  <rect x="212" y="68" width="35" height="5" rx="2" fill="#E2E8F0"/>
  <rect x="212" y="78" width="40" height="5" rx="2" fill="#E2E8F0"/>

  <path d="M30 80 Q30 65 45 65 L85 65 Q100 65 100 80 L100 100 Q100 112 85 112 L65 112 L55 125 L58 112 Q30 112 30 100 Z" fill="#10B981" stroke="#059669" stroke-width="2"/>
  <rect x="42" y="78" width="45" height="5" rx="2" fill="white" opacity="0.8"/>
  <rect x="42" y="88" width="35" height="5" rx="2" fill="white" opacity="0.6"/>
  <rect x="42" y="98" width="40" height="5" rx="2" fill="white" opacity="0.6"/>

