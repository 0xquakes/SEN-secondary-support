<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" fill="none">
  <!-- Background gradient effect -->
  <ellipse cx="200" cy="100" rx="180" ry="80" fill="#ECFDF5" opacity="0.4"/>

  <!-- Central lightbulb/idea -->
  <circle cx="200" cy="85" r="40" fill="#FEF3C7" stroke="#FCD34D" stroke-width="3"/>
  <path d="M188 120 L188 135 L212 135 L212 120" stroke="#FCD34D" stroke-width="3" fill="none" stroke-linecap="round"/>
  <line x1="192" y1="140" x2="208" y2="140" stroke="#FCD34D" stroke-width="3" stroke-linecap="round"/>
  <line x1="195" y1="145" x2="205" y2="145" stroke="#FCD34D" stroke-width="3" stroke-linecap="round"/>

  <!-- Light rays -->
  <line x1="200" y1="35" x2="200" y2="20" stroke="#FCD34D" stroke-width="3" stroke-linecap="round"/>
  <line x1="235" y1="50" x2="248" y2="37" stroke="#FCD34D" stroke-width="3" stroke-linecap="round"/>
  <line x1="165" y1="50" x2="152" y2="37" stroke="#FCD34D" stroke-width="3" stroke-linecap="round"/>
  <line x1="250" y1="85" x2="265" y2="85" stroke="#FCD34D" stroke-width="3" stroke-linecap="round"/>
  <line x1="150" y1="85" x2="135" y2="85" stroke="#FCD34D" stroke-width="3" stroke-linecap="round"/>

  <!-- Step indicators on left -->
  <circle cx="60" cy="60" r="18" fill="#10B981"/>
  <text x="60" y="66" text-anchor="middle" font-family="system-ui" font-size="16" font-weight="bold" fill="white">1</text>
  <line x1="60" y1="78" x2="60" y2="100" stroke="#10B981" stroke-width="2" stroke-dasharray="4 3"/>
  <circle cx="60" cy="118" r="18" fill="#10B981"/>
  <text x="60" y="124" text-anchor="middle" font-family="system-ui" font-size="16" font-weight="bold" fill="white">2</text>
  <line x1="60" y1="136" x2="60" y2="158" stroke="#10B981" stroke-width="2" stroke-dasharray="4 3"/>
  <circle cx="60" cy="176" r="18" fill="#D1FAE5" stroke="#10B981" stroke-width="2"/>
  <text x="60" y="182" text-anchor="middle" font-family="system-ui" font-size="16" font-weight="bold" fill="#10B981">3</text>

  <!-- Checklist on right -->
  <rect x="290" y="50" width="90" height="110" rx="6" fill="white" stroke="#E2E8F0" stroke-width="2"/>
  <rect x="305" y="65" width="60" height="6" rx="2" fill="#E2E8F0"/>
  <rect x="305" y="80" width="12" height="12" rx="2" fill="#10B981"/>
  <path d="M308 86 L311 89 L314 83" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="322" y="83" width="45" height="5" rx="1" fill="#E2E8F0"/>
  <rect x="305" y="100" width="12" height="12" rx="2" fill="#10B981"/>
  <path d="M308 106 L311 109 L314 103" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="322" y="103" width="40" height="5" rx="1" fill="#E2E8F0"/>
  <rect x="305" y="120" width="12" height="12" rx="2" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="1"/>
  <rect x="322" y="123" width="50" height="5" rx="1" fill="#E2E8F0"/>
  <rect x="305" y="140" width="12" height="12" rx="2" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="1"/>
  <rect x="322" y="143" width="35" height="5" rx="1" fill="#E2E8F0"/>

  <!-- Small decorative elements -->
  <circle cx="100" cy="30" r="6" fill="#A5F3FC"/>
  <circle cx="320" cy="30" r="8" fill="#C4B5FD"/>
  <path d="M130 170 L132 176 L138 176 L133 180 L135 186 L130 182 L125 186 L127 180 L122 176 L128 176 Z" fill="#FCD34D"/>
